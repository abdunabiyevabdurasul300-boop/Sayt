<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DONUZ — O‘yin donati</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap"><header><div class="brand">DONUZ</div><p>O‘yin donati va hisob boshqaruvi</p></header>
<section class="panel" id="login"><h2>Telegram orqali kirish</h2><form id="requestForm"><label for="telegramId">Telegram ID</label><input id="telegramId" inputmode="numeric" autocomplete="off" placeholder="Masalan: 123456789" required><button type="submit">Kod olish</button></form>
<form id="verifyForm" hidden><label for="code">Telegram bot yuborgan kod</label><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 xonali kod" required><button type="submit">Tasdiqlash</button></form><p id="loginMsg" class="message" aria-live="polite"></p><p id="balance">Balans: —</p></section>
<section class="panel"><h2>O‘yinlar katalogi</h2><p id="catalogMsg" class="message"></p><div id="catalog" class="catalog"></div><form id="orderForm" hidden><label id="playerLabel" for="playerId">O‘yin ID</label><input id="playerId" placeholder="O‘yin ID" required><div id="serverId" hidden><label for="serverValue">Server ID</label><input id="serverValue" placeholder="Server ID"></div><button type="button" id="checkId">ID tekshirish</button><p id="checkMsg" class="message" aria-live="polite"></p><button type="button" id="buyBtn">Buyurtma qilish</button></form></section>
<footer>DONUZ</footer></main><script src="/script.js" defer></script></body></html>
