<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME DONAT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎮 GAME DONAT</h1>
  <button id="loginBtn" class="top-btn" onclick="openLogin()">🔐 Kirish</button>
</header>

<main class="container">
  <section class="hero">
    <h2>GAME DONAT</h2>
    <p>O‘yinlaringiz uchun donatlarni tez va oson xarid qiling.</p>
    <div id="accountBox" class="account hidden"></div>
  </section>

  <div id="notice" class="notice hidden"></div>

  <h2 class="title">🎮 O‘yinlar</h2>
  <div id="games" class="games">
    <div class="loading">⏳ Katalog yuklanmoqda...</div>
  </div>
</main>

<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeLogin()">✕</button>
    <h2>🔐 Saytga kirish</h2>
    <p>Telegram botingizdagi ID orqali kirishingiz kerak.</p>
    <input id="telegramId" inputmode="numeric" placeholder="Telegram ID">
    <button onclick="requestCode()">📨 Kod yuborish</button>
    <input id="authCode" class="hidden" inputmode="numeric" placeholder="Telegramga kelgan 6 xonali kod">
    <button id="verifyBtn" class="hidden" onclick="verifyCode()">✅ Tasdiqlash</button>
    <p id="loginStatus" class="small"></p>
  </div>
</div>

<div id="orderModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeOrder()">✕</button>
    <h2 id="orderTitle">🛒 Buyurtma</h2>
    <p id="orderPackage"></p>
    <input id="playerId" placeholder="Player ID">
    <input id="serverId" class="hidden" placeholder="Server ID">
    <button id="checkBtn" onclick="checkId()">🔎 ID ni tekshirish</button>
    <div id="checkResult" class="check-result"></div>
    <button id="orderBtn" class="hidden" onclick="createOrder()">💳 Buyurtma berish</button>
  </div>
</div>

<footer>© 2026 GAME DONAT</footer>
<script src="script.js"></script>
</body>
</html>
