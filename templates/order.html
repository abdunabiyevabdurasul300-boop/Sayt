{% extends "base.html" %}{% block content %}<div class="card"><h2>📦 Buyurtma #{{o.id}}</h2><p>Tur: {{o.kind}}</p><p>Target: {{o.target}}</p><p>Status: <b id="status">{{o.status}}</b></p><button id="check">🔄 Statusni tekshirish</button></div><script>document.getElementById("check").onclick=async()=>{let r=await fetch("/api/order/{{o.id}}/status");let x=await r.json();let d=x.order||x;document.getElementById("status").textContent=d.status||x.status||"error";};</script>{% endblock %}
